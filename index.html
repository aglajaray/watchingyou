<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Virbalio kodas – AR bandymas</title>

  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

  <style>
    body { margin:0; overflow:hidden; font-family:Arial,sans-serif; }
    #hint {
      position:fixed; z-index:10; left:50%; top:18px; transform:translateX(-50%);
      background:rgba(0,0,0,.72); color:white; padding:10px 14px; border-radius:20px;
      text-align:center; max-width:85vw; font-size:14px;
    }
  </style>
</head>
<body>
  <div id="hint">Nukreipk kamerą į žaliai rudą iliustraciją</div>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; uiScanning: yes; uiLoading: yes;"
    embedded
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false">

    <a-assets>
      <img id="eyes" src="./eyes.png">
    </a-assets>

    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

    <a-entity mindar-image-target="targetIndex: 0">
      <a-image
        src="#eyes"
        position="0 0 0.05"
        width="1"
        height="0.586"
        material="transparent: true; alphaTest: 0.05">
      </a-image>
    </a-entity>
  </a-scene>
</body>
</html>
