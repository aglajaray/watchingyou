<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Watching You – AR test v2</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#000; }
    #status {
      position:fixed; z-index:20; top:16px; left:50%; transform:translateX(-50%);
      max-width:88vw; padding:10px 14px; border-radius:18px;
      background:rgba(0,0,0,.72); color:#fff; font:14px Arial,sans-serif;
      text-align:center; pointer-events:none;
    }
  </style>
</head>
<body>
  <div id="status">Nukreipk kamerą į naują detalų paveikslą</div>
  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; warmupTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled: false"
    device-orientation-permission-ui="enabled: false"
    embedded>
    <a-assets>
      <img id="eyes" src="./eyes.png">
    </a-assets>
    <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>
    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <a-image src="#eyes"
        position="0 0 0.08"
        width="0.72"
        height="0.422"
        material="shader: flat; transparent: true; alphaTest: 0.02; side: double;">
      </a-image>
    </a-entity>
  </a-scene>
  <script>
    const target = document.querySelector('#target');
    const status = document.querySelector('#status');
    target.addEventListener('targetFound', () => {
      status.textContent = '✓ Atpažinta — AR akys rodomos';
      setTimeout(() => status.style.opacity = '0', 1400);
    });
    target.addEventListener('targetLost', () => {
      status.style.opacity = '1';
      status.textContent = 'Markeris pamestas — vėl nukreipk kamerą į paveikslą';
    });
  </script>
</body>
</html>
