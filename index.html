<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Watching You – AR test v3</title>
  <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#000;font-family:Arial,sans-serif}
    #status{position:fixed;z-index:30;top:16px;left:50%;transform:translateX(-50%);
      max-width:88vw;padding:10px 14px;border-radius:18px;background:rgba(0,0,0,.72);
      color:#fff;text-align:center;font-size:14px;pointer-events:none}
    #start{position:fixed;z-index:40;left:50%;bottom:28px;transform:translateX(-50%);
      border:0;border-radius:24px;padding:13px 20px;font-size:16px;background:#fff;color:#111}
  </style>
</head>
<body>
  <div id="status">Paspausk „Pradėti patirtį“, tada nukreipk kamerą į markerį</div>
  <button id="start">Pradėti patirtį</button>
  <audio id="memory" src="./memory.mp3" preload="auto"></audio>

  <a-scene
    mindar-image="imageTargetSrc: ./targets.mind; autoStart: true; filterMinCF: 0.001; filterBeta: 0.01; missTolerance: 5; warmupTolerance: 5;"
    color-space="sRGB"
    renderer="colorManagement: true, physicallyCorrectLights"
    vr-mode-ui="enabled:false"
    device-orientation-permission-ui="enabled:false"
    embedded>
    <a-assets><img id="character" src="./character.png"></a-assets>
    <a-camera position="0 0 0" look-controls="enabled:false"></a-camera>

    <a-entity id="target" mindar-image-target="targetIndex: 0">
      <!-- Personažas pakeltas virš markerio ir šiek tiek prieš jį -->
      <a-image id="person"
        src="#character"
        position="0 0.82 0.12"
        width="0.92"
        height="0.92"
        material="shader:flat; transparent:true; alphaTest:0.02; side:double"
        scale="0.01 0.01 0.01"
        animation__appear="property:scale; from:0.01 0.01 0.01; to:1 1 1; dur:1100; easing:easeOutElastic; startEvents:showCharacter">
      </a-image>
    </a-entity>
  </a-scene>

  <script>
    const target = document.querySelector('#target');
    const person = document.querySelector('#person');
    const status = document.querySelector('#status');
    const start = document.querySelector('#start');
    const sound = document.querySelector('#memory');
    let unlocked = false;

    start.addEventListener('click', async () => {
      // User gesture unlocks audio on mobile browsers.
      try {
        sound.volume = 0;
        await sound.play();
        sound.pause();
        sound.currentTime = 0;
        sound.volume = 1;
        unlocked = true;
      } catch(e) {}
      start.style.display = 'none';
      status.textContent = 'Nukreipk kamerą į detalų markerio paveikslą';
    });

    target.addEventListener('targetFound', async () => {
      status.textContent = '✓ Atpažinta — personažas ir atminties garsas aktyvuoti';
      person.setAttribute('scale','0.01 0.01 0.01');
      person.emit('showCharacter');
      if (unlocked) {
        sound.currentTime = 0;
        try { await sound.play(); } catch(e) {}
      }
      setTimeout(()=>status.style.opacity='0',1800);
    });

    target.addEventListener('targetLost', () => {
      status.style.opacity='1';
      status.textContent='Markeris pamestas — nukreipk kamerą atgal';
      sound.pause();
    });
  </script>
</body>
</html>
